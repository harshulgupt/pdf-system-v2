<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Processing System</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f5f4; color: #1c1917; min-height: 100vh; padding: 2rem 1rem; }
  h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 2rem; }
  h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; color: #44403c; }
  .container { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
  .card { background: #fff; border: 1px solid #e7e5e4; border-radius: 10px; padding: 1.5rem; }
  label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; }
  input[type=file], input[type=text], input[type=number] {
    width: 100%; border: 1px solid #d6d3d1; border-radius: 6px;
    padding: 0.5rem 0.75rem; font-size: 0.875rem; background: #fafaf9;
  }
  input[type=file] { cursor: pointer; }
  button {
    display: inline-flex; align-items: center; gap: 0.4rem;
    padding: 0.5rem 1.25rem; border-radius: 6px; border: none;
    font-size: 0.875rem; font-weight: 500; cursor: pointer;
    background: #0c4a6e; color: #fff; transition: background 0.15s;
  }
  button:hover { background: #075985; }
  button:disabled { background: #a8a29e; cursor: not-allowed; }
  .btn-secondary { background: #f5f5f4; color: #1c1917; border: 1px solid #d6d3d1; }
  .btn-secondary:hover { background: #e7e5e4; }
  .progress-wrap { margin-top: 1rem; display: none; }
  .progress-bar-bg { height: 8px; background: #e7e5e4; border-radius: 99px; overflow: hidden; }
  .progress-bar { height: 100%; background: #0284c7; border-radius: 99px; width: 0%; transition: width 0.2s; }
  .progress-label { font-size: 0.8rem; color: #78716c; margin-top: 0.4rem; }
  .log { margin-top: 1rem; font-size: 0.8rem; color: #57534e; background: #fafaf9; border: 1px solid #e7e5e4; border-radius: 6px; padding: 0.75rem; max-height: 180px; overflow-y: auto; display: none; }
  .log p { margin-bottom: 0.2rem; }
  .log p.ok { color: #15803d; }
  .log p.err { color: #dc2626; }
  .search-row { display: flex; gap: 0.5rem; }
  .search-row input { flex: 1; }
  .results { margin-top: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
  .result-card { border: 1px solid #e7e5e4; border-radius: 8px; padding: 1rem; background: #fafaf9; }
  .result-meta { font-size: 0.75rem; color: #78716c; margin-bottom: 0.4rem; }
  .result-snippet { font-size: 0.875rem; line-height: 1.6; white-space: pre-wrap; }
  .chunk-size-row { display: flex; align-items: center; gap: 0.75rem; margin-top: 0.75rem; }
  .chunk-size-row label { margin: 0; white-space: nowrap; font-size: 0.8rem; color: #78716c; }
  .badge { display: inline-block; font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 99px; font-weight: 500; }
  .badge-blue { background: #dbeafe; color: #1d4ed8; }
  .badge-green { background: #dcfce7; color: #15803d; }
  .badge-red { background: #fee2e2; color: #dc2626; }
  .no-results { font-size: 0.875rem; color: #78716c; text-align: center; padding: 1.5rem 0; }
  mark { background: #fef08a; border-radius: 2px; padding: 0 2px; }
</style>
</head>
<body>
<div class="container">
  <h1>PDF Processing System</h1>

  <!-- ── Upload Card ── -->
  <div class="card">
    <h2>Upload a PDF</h2>
    <label for="pdf-file">Select PDF file</label>
    <input type="file" id="pdf-file" accept=".pdf">

    <div class="chunk-size-row">
      <label for="chunk-mb">Chunk size (MB):</label>
      <input type="number" id="chunk-mb" value="10" min="1" max="100" style="width:70px">
      <label for="concurrency" style="margin-left:1rem">Parallel workers:</label>
      <input type="number" id="concurrency" value="4" min="1" max="16" style="width:60px">
    </div>

    <div style="margin-top:1rem; display:flex; gap:0.5rem; align-items:center">
      <button id="upload-btn" onclick="startUpload()">Upload &amp; Process</button>
      <span id="upload-status-badge"></span>
    </div>

    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-bar-bg"><div class="progress-bar" id="progress-bar"></div></div>
      <div class="progress-label" id="progress-label">0 / 0 chunks uploaded</div>
      <div class="progress-label" id="progress-speed" style="margin-top:0.15rem"></div>
    </div>
    <div class="log" id="upload-log"></div>
  </div>

  <!-- ── Search Card ── -->
  <div class="card">
    <h2>Search</h2>
    <div style="margin-bottom:0.75rem">
      <label for="upload-id-filter">Limit to upload ID (optional)</label>
      <input type="text" id="upload-id-filter" placeholder="Paste an upload_id to search one PDF only">
    </div>
    <div class="search-row">
      <input type="text" id="search-query" placeholder="Enter search terms…" onkeydown="if(event.key==='Enter')doSearch()">
      <button onclick="doSearch()">Search</button>
    </div>
    <div class="results" id="results"></div>
  </div>
</div>

<script>
const API = '';

// ── Logging ──────────────────────────────────────────────────────────────────
const logEl = document.getElementById('upload-log');
function log(msg, type = '') {
  logEl.style.display = 'block';
  const p = document.createElement('p');
  if (type) p.className = type;
  p.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  logEl.appendChild(p);
  logEl.scrollTop = logEl.scrollHeight;
}
function setBadge(text, type) {
  document.getElementById('upload-status-badge').innerHTML =
    `<span class="badge badge-${type}">${text}</span>`;
}

// ── Progress ──────────────────────────────────────────────────────────────────
let _uploadStart = 0;
let _bytesUploaded = 0;

function setProgress(done, total, chunkBytes) {
  _bytesUploaded += chunkBytes;
  document.getElementById('progress-wrap').style.display = 'block';
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-label').textContent =
    `${done} / ${total} chunks  (${pct}%)`;

  const elapsed = (Date.now() - _uploadStart) / 1000;
  if (elapsed > 1) {
    const mbps = (_bytesUploaded / elapsed / 1024 / 1024).toFixed(1);
    document.getElementById('progress-speed').textContent = `${mbps} MB/s`;
  }
}

// ── Parallel worker pool ──────────────────────────────────────────────────────
/*
  Why a worker pool and not Promise.all()?

  Promise.all() would fire every chunk simultaneously. For a 20 GB file at 10 MB
  chunks that is 2000 concurrent HTTP requests — the browser will queue most of
  them, R2 will rate-limit, and memory spikes because every slice is held open.

  A worker pool keeps exactly CONCURRENCY requests in-flight at any time.
  When one finishes, the next chunk starts immediately — so we always saturate
  the network without flooding it. This is the same pattern S3 SDKs use internally.

  CONCURRENCY = 4 is a good default:
    - Browsers allow 6 connections per host; 4 leaves headroom for confirm calls.
    - Raising to 8 helps on fast connections (>100 Mbps) but hurts on mobile.
    - The user can tune it in the UI.

  Retry logic: each chunk retries up to MAX_RETRIES times with exponential backoff
  before the whole upload is aborted. This handles transient R2 errors without
  requiring the user to restart from zero.
*/
async function uploadChunksParallel(file, initData, CHUNK_SIZE, CONCURRENCY) {
  const totalChunks = initData.chunks.length;
  const uploadId = initData.upload_id;
  const MAX_RETRIES = 3;

  // Queue of chunk indices still to upload
  const queue = Array.from({ length: totalChunks }, (_, i) => i);
  let done = 0;
  let failed = false;
  let failureReason = '';

  async function uploadOne(i) {
    const chunkInfo = initData.chunks[i];
    const start = i * CHUNK_SIZE;
    const end = Math.min(start + CHUNK_SIZE, file.size);
    const slice = file.slice(start, end);
    const chunkBytes = end - start;

    for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
      try {
        // 1. Upload directly to Backblaze B2 using the pre-signed URL
        const putRes = await fetch(chunkInfo.presigned_url, {
          method: 'PUT',
          body: slice,
        });
        if (!putRes.ok) throw new Error(`B2 Upload HTTP ${putRes.status}: ${await putRes.text()}`);

        // 2. Confirm receipt in the database
        const confRes = await fetch(`${API}/api/upload/chunk/confirm`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ upload_id: uploadId, chunk_index: i })
        });
        if (!confRes.ok) throw new Error(`DB Confirm HTTP ${confRes.status}`);

        done++;
        setProgress(done, totalChunks, chunkBytes);
        return;
      } catch (e) {
        if (attempt === MAX_RETRIES) {
          failed = true;
          failureReason = `Chunk ${i} failed after ${MAX_RETRIES} attempts: ${e.message}`;
          throw e;
        }
        const wait = 500 * Math.pow(2, attempt - 1);
        log(`Chunk ${i} attempt ${attempt} failed (${e.message}), retrying in ${wait}ms…`);
        await new Promise(r => setTimeout(r, wait));
      }
    }
  }

  // Worker: keep pulling from the queue until empty or a failure occurs
  async function worker() {
    while (queue.length > 0 && !failed) {
      const i = queue.shift();
      if (i === undefined) break;
      await uploadOne(i);
    }
  }

  // Launch CONCURRENCY workers simultaneously
  const workers = Array.from({ length: Math.min(CONCURRENCY, totalChunks) }, worker);
  await Promise.all(workers);  // all workers finish (or one throws)

  if (failed) throw new Error(failureReason);
}

// ── Main upload flow ──────────────────────────────────────────────────────────
async function startUpload() {
  const fileInput = document.getElementById('pdf-file');
  const file = fileInput.files[0];
  if (!file) return alert('Please select a PDF file first.');
  if (!file.name.toLowerCase().endsWith('.pdf')) return alert('Only PDF files are accepted.');

  // Generate a pseudo-hash to detect duplicate files
  const sliceSize = Math.min(file.size, 1024 * 1024);
  const buffer = await file.slice(0, sliceSize).arrayBuffer();
  const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  const fileHash = `${hashHex}-${file.size}-${file.lastModified}`;

  const CHUNK_SIZE    = parseInt(document.getElementById('chunk-mb').value)  * 1024 * 1024;
  const CONCURRENCY   = parseInt(document.getElementById('concurrency').value);
  const totalChunks   = Math.ceil(file.size / CHUNK_SIZE);

  logEl.innerHTML = '';
  logEl.style.display = 'block';
  document.getElementById('upload-btn').disabled = true;
  setBadge('initiating…', 'blue');
  _uploadStart = Date.now();
  _bytesUploaded = 0;

  log(`File: ${file.name}  (${(file.size / 1024 / 1024).toFixed(1)} MB)`);
  log(`${totalChunks} chunks × ${document.getElementById('chunk-mb').value} MB  |  ${CONCURRENCY} parallel workers`);

  // ── Step 1: init ─────────────────────────────────────────────────────────
  let initData;
  try {
    const res = await fetch(`${API}/api/upload/init`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename: file.name, total_chunks: totalChunks, file_hash: fileHash }),
    });
    if (!res.ok) throw new Error(await res.text());
    initData = await res.json();
    
    if (initData.status === "existing") {
      log(`File already uploaded — upload ID: ${initData.upload_id}`, 'ok');
      document.getElementById('upload-id-filter').value = initData.upload_id;
      setBadge('ready', 'green');
      document.getElementById('upload-btn').disabled = false;
      return;
    }
    
    log(`Initiated — upload ID: ${initData.upload_id}`, 'ok');
    document.getElementById('upload-id-filter').value = initData.upload_id;
  } catch (e) {
    log(`Init failed: ${e.message}`, 'err');
    setBadge('failed', 'red');
    document.getElementById('upload-btn').disabled = false;
    return;
  }

  // ── Step 2: parallel upload to R2 ────────────────────────────────────────
  setBadge('uploading…', 'blue');
  setProgress(0, totalChunks, 0);

  try {
    await uploadChunksParallel(file, initData, CHUNK_SIZE, CONCURRENCY);
    log(`All ${totalChunks} chunks uploaded in ${((Date.now() - _uploadStart)/1000).toFixed(1)}s`, 'ok');
  } catch (e) {
    log(e.message, 'err');
    setBadge('failed', 'red');
    document.getElementById('upload-btn').disabled = false;
    return;
  }

  // ── Step 3: complete → trigger extraction ─────────────────────────────────
  setBadge('processing…', 'blue');
  log('Starting text extraction…');
  try {
    const res = await fetch(`${API}/api/upload/${initData.upload_id}/complete`, { method: 'POST' });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    log(`Done — status: ${data.status}`, 'ok');
    setBadge('ready', 'green');
  } catch (e) {
    log(`Processing failed: ${e.message}`, 'err');
    setBadge('processing error', 'red');
  }

  document.getElementById('upload-btn').disabled = false;
}

// ── Search ────────────────────────────────────────────────────────────────────
async function doSearch() {
  const q = document.getElementById('search-query').value.trim();
  if (!q) return;
  const uploadId  = document.getElementById('upload-id-filter').value.trim();
  const resultsEl = document.getElementById('results');
  resultsEl.innerHTML = '<div class="no-results">Searching…</div>';

  let url = `${API}/api/search/?q=${encodeURIComponent(q)}&limit=10`;
  if (uploadId) url += `&upload_id=${encodeURIComponent(uploadId)}`;

  try {
    const res  = await fetch(url);
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();

    if (!data.results.length) {
      resultsEl.innerHTML = '<div class="no-results">No results found.</div>';
      return;
    }

    const summary = `
      <div style="font-size:0.8rem;color:#57534e;padding:0.5rem 0.75rem;background:#f5f5f4;border-radius:6px;border:1px solid #e7e5e4;margin-bottom:0.5rem">
        Found <strong>${data.total_occurrences.toLocaleString()}</strong> occurrence${data.total_occurrences !== 1 ? 's' : ''}
        across <strong>${data.total_chunks_matched}</strong> section${data.total_chunks_matched !== 1 ? 's' : ''}
      </div>`;

    const cards = data.results.map(r => {
      const occurrenceList = r.snippets.map((snippet, idx) => `
        <div style="padding:0.35rem 0.6rem;margin:0.25rem 0;background:#fff;border-left:3px solid #0284c7;font-size:0.82rem;font-family:monospace;line-height:1.5;white-space:pre-wrap">${highlight(escHtml(snippet), q)}</div>
      `).join('');

      return `
        <div class="result-card">
          <div class="result-meta" style="margin-bottom:0.5rem">
            <strong>${escHtml(r.filename)}</strong> &nbsp;·&nbsp;
            Section ${r.chunk_index} &nbsp;·&nbsp;
            <span style="background:#dbeafe;color:#1d4ed8;font-size:0.7rem;padding:0.1rem 0.4rem;border-radius:99px;font-weight:600">
              ${r.occurrences_in_chunk} occurrence${r.occurrences_in_chunk !== 1 ? 's' : ''}
            </span>
          </div>
          <div>${occurrenceList}</div>
        </div>`;
    }).join('');

    resultsEl.innerHTML = summary + cards;
  } catch (e) {
    resultsEl.innerHTML =
      `<div class="no-results" style="color:#dc2626">Error: ${escHtml(e.message)}</div>`;
  }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlight(html, query) {
  const terms = query.trim().split(/\s+/).filter(Boolean)
    .map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (!terms.length) return html;
  let result = html;
  for (const term of terms) {
    result = result.replace(new RegExp(`(${term})`, 'gi'), '<mark>$1</mark>');
  }
  return result;
}
</script>
</body>
</html>
